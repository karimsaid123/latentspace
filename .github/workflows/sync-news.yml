name: Autonomous Telemetry Harvest

on:
  schedule:
    # Runs every 20 minutes automatically
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: autonomous-telemetry-harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run autonomous feed ingestion
        run: npm run sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push if fresh telemetry was harvested
        run: |
          git config --global user.name "LatentSpace Bot"
          git config --global user.email "bot@latentspace.science"
          git add data/articles.json data/sources.json
          if git diff --staged --quiet; then
            echo "No new telemetry harvested in this cycle."
          else
            git commit -m "chore(telemetry): autonomous harvest cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
