    <path d="M0,-45 C8,-15 15,-8 45,0 C15,8 8,15 0,45 C-8,15 -15,8 -45,0 C-15,-8 -8,-15 0,-45 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="#4285f4"/>
  
  </g>

  <!-- Giant Swiss Monogram Headline -->
  <text x="48" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#ffffff">GOOGLE DEEPMIND</text>
