<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0c0d10"/>
  <defs>
    <pattern id="grid_microsoftai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad_microsoftai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grid_microsoftai)"/>

  <!-- Technical border frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#00a4ef" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <text x="48" y="68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#00a4ef">[MICROSOFT RESEARCH // AZURE AI INFRASTRUCTURE]</text>
  <text x="752" y="68" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.4)">TELEMETRY // LIVE</text>
  <line x1="48" y1="82" x2="752" y2="82" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Center Symbol -->
  <g transform="translate(400, 275)">
    
    <circle r="120" fill="none" stroke="rgba(0,164,239,0.15)" stroke-width="2"/>
    <!-- 4 Squares -->
    <rect x="-55" y="-55" width="50" height="50" fill="#f25022"/>
    <rect x="5" y="-55" width="50" height="50" fill="#7fba00"/>
    <rect x="-55" y="5" width="50" height="50" fill="#00a4ef"/>
    <rect x="5" y="5" width="50" height="50" fill="#ffb900"/>
  
  </g>

  <!-- Giant Swiss Monogram Headline -->
  <text x="48" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#ffffff">MICROSOFT AI</text>
  <text x="48" y="505" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#00a4ef">PHI-4 // COPILOT RUNTIME // MAIA ACCELERATORS</text>

  <!-- Bottom Technical Hairline & Status -->
  <line x1="48" y1="525" x2="752" y2="525" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="48" y="548" font-family="monospace" font-size="9" letter-spacing="2" fill="rgba(255,255,255,0.4)">SMALL LANGUAGE MODELS // HIGH TOKEN THROUGHPUT</text>
  <text x="752" y="548" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="2" fill="#00a4ef">STATUS: ONLINE</text>
</svg>