<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0c0d10"/>
  <defs>
    <pattern id="grid_mistralai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad_mistralai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7000"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grid_mistralai)"/>

  <!-- Technical border frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#ff7000" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <text x="48" y="68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#ff7000">[MISTRAL AI // EUROPEAN FRONTIER LAB]</text>
  <text x="752" y="68" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.4)">TELEMETRY // LIVE</text>
  <line x1="48" y1="82" x2="752" y2="82" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Center Symbol -->
  <g transform="translate(400, 275)">
    
    <circle r="120" fill="none" stroke="rgba(255,112,0,0.15)" stroke-width="2"/>
    <!-- Mistral Pixel Blocks -->
    <rect x="-60" y="-40" width="25" height="25" fill="#ff7000"/>
    <rect x="-30" y="-65" width="25" height="25" fill="#ff7000"/>
    <rect x="0" y="-40" width="25" height="25" fill="#ff7000"/>
    <rect x="30" y="-65" width="25" height="25" fill="#ff7000"/>
    <rect x="-30" y="-10" width="25" height="25" fill="#ff7000"/>
    <rect x="0" y="15" width="25" height="25" fill="#ff7000"/>
    <rect x="-60" y="40" width="25" height="25" fill="#ff7000"/>
    <rect x="30" y="40" width="25" height="25" fill="#ff7000"/>
  
  </g>

  <!-- Giant Swiss Monogram Headline -->
  <text x="48" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#ffffff">MISTRAL AI</text>
  <text x="48" y="505" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#ff7000">LE CHAT // PIXTRAL // LARGE 2 ARCHITECTURE</text>

  <!-- Bottom Technical Hairline & Status -->
  <line x1="48" y1="525" x2="752" y2="525" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="48" y="548" font-family="monospace" font-size="9" letter-spacing="2" fill="rgba(255,255,255,0.4)">WEIGHT PRUNING // ADVANCED SPARSITY OPTIMIZATIONS</text>
  <text x="752" y="548" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="2" fill="#ff7000">STATUS: ONLINE</text>
</svg>