    <circle cx="-22" cy="-10" r="9" fill="#0c0d10"/>
    <circle cx="22" cy="-10" r="9" fill="#0c0d10"/>
    <path d="M-28,18 Q0,45 28,18" fill="none" stroke="#0c0d10" stroke-width="8" stroke-linecap="round"/>
  
  </g>

  <!-- Giant Swiss Monogram Headline -->
  <text x="48" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#ffffff">HUGGING FACE</text>
