  <text x="48" y="548" font-family="monospace" font-size="9" letter-spacing="2" fill="rgba(255,255,255,0.4)">TRANSFORMERS // PEFT // SAFETENSORS DISTRIBUTION</text>
  <text x="752" y="548" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="2" fill="#f59e0b">STATUS: ONLINE</text>
