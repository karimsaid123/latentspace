<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0c0d10"/>
  <defs>
    <pattern id="grid_theverge" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad_theverge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grid_theverge)"/>

  <!-- Technical border frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#e11d48" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <text x="48" y="68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#e11d48">[THE VERGE // CULTURE &amp; CONSUMER TECH]</text>
  <text x="752" y="68" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.4)">TELEMETRY // LIVE</text>
  <line x1="48" y1="82" x2="752" y2="82" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Center Symbol -->
  <g transform="translate(400, 275)">
    
    <circle r="120" fill="none" stroke="rgba(225,29,72,0.15)" stroke-width="2"/>
    <!-- Verge Geometric Triangle -->
    <polygon points="0,-70 65,50 -65,50" fill="none" stroke="#e11d48" stroke-width="16" stroke-linejoin="miter"/>
    <polygon points="0,-25 25,25 -25,25" fill="#ffffff"/>
  
  </g>

  <!-- Giant Swiss Monogram Headline -->
  <text x="48" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#ffffff">THE VERGE</text>
  <text x="48" y="505" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#e11d48">AI REVIEWS // POLICY &amp; PRODUCT DISPATCH</text>

  <!-- Bottom Technical Hairline & Status -->
  <line x1="48" y1="525" x2="752" y2="525" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="48" y="548" font-family="monospace" font-size="9" letter-spacing="2" fill="rgba(255,255,255,0.4)">FRONTIER INTERSECTION OF CONSUMER TECH &amp; SOCIETY</text>
  <text x="752" y="548" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="2" fill="#e11d48">STATUS: ONLINE</text>
</svg>